<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Transforme Textos</title>
  </head>
  <body>
    <div class="container-pai">
      <header class="cabecalho"></header>
      <img src="/icons/logo_tt16.png" alt="Imagem da logo" class="logo"/>
      <h1>TRANSFORME textos</h1>

      <input type="text" id="input-text" class="input-text" maxlength="500" placeholder="Digite o texto aqui" required/>

      <div class="container-button">
        <button class="btn" id="btnMaiuscula">MAIÚSCULA</button>
        <button class="btn" id="btnMinuscula">minúscula</button>
        <button class="btn btn-primeira" id="btnPrimeiraLetra">1º Letra Maiúscula</button>
        <button class="btn btn-limpar" id="btnLimpar">LIMPAR</button>
        <button class="btn btn-contar" id="btnContar">Contar Caracteres</button>
      </div>

      <div id="result" class="result">Resultado:</div>

      <div id="text-info" class="text-info">
        <p>Para mais opções, visite:</p>
        <a href="https://tiagoneves.com.br" target="_blank">tiagoneves.com.br</a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
